<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人简介</title>
  <style>
    :root {
      --bg: #f6f3ef;
      --card: #ffffff;
      --text: #1c1c1c;
      --muted: #6a6a6a;
      --accent: #0f4c81;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background: radial-gradient(1200px 800px at 20% -10%, #e5edf7, transparent),
                  radial-gradient(1000px 700px at 110% 10%, #f7e6d6, transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border: 1px solid #e6e1db;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 32px;
      text-align: center;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      object-fit: cover;
    }
    .handle {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.6px;
      color: var(--accent);
    }
    @media (max-width: 640px) {
      .card { width: min(420px, 92vw); }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://github.com/im.png" alt="大橙子 头像" />
    <p class="handle">im</p>
  </main>
</body>
</html>
