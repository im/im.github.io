<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人简介</title>
  <style>
    :root {
      --bg: #f6f3ef;
      --card: #ffffff;
      --text: #1c1c1c;
      --muted: #6a6a6a;
      --accent: #0f4c81;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background: radial-gradient(1200px 800px at 20% -10%, #e5edf7, transparent),
                  radial-gradient(1000px 700px at 110% 10%, #f7e6d6, transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(720px, 92vw);
      background: var(--card);
      border: 1px solid #e6e1db;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 28px;
      padding: 32px;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      object-fit: cover;
    }
    h1 {
      margin: 4px 0 8px;
      font-size: 34px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }
    .tag {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef3f8;
      color: var(--accent);
      font-size: 13px;
      border: 1px solid #dbe6f2;
    }
    @media (max-width: 640px) {
      .card {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .avatar { margin: 0 auto; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://github.com/im.png" alt="大橙子 头像" />
    <div>
      <h1>大橙子</h1>
      <p class="subtitle">GitHub 账号：im</p>
      <span class="tag">个人简介</span>
    </div>
  </main>
</body>
</html>
